<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Results Gallery</title>
    <!-- Viewer.js CSS for image viewing and zooming -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; }
        h1 { text-align: center; color: #2c3e50; }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .img-card { background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .img-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .img-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .img-info { margin-top: 10px; font-size: 13px; color: #7f8c8d; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

    <h1>Project Image Gallery</h1>
    <div id="gallery"></div>

    <!-- Viewer.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
    <script>
        // Fetch the list of images generated by the notebook
        fetch('images.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('gallery');
                data.forEach(path => {
                    // Only show images in the thumbnail gallery
                    if (!path.toLowerCase().match(/\.(png|jpg|jpeg|gif)$/)) return;

                    const card = document.createElement('div');
                    card.className = 'img-card';
                    
                    const img = document.createElement('img');
                    img.src = path;
                    img.alt = path.split('/').pop();
                    
                    const info = document.createElement('div');
                    info.className = 'img-info';
                    info.textContent = img.alt;
                    
                    card.appendChild(img);
                    card.appendChild(info);
                    container.appendChild(card);
                });

                // Initialize Viewer.js on the gallery container
                new Viewer(container, {
                    url: 'src',
                    toolbar: true, // Enables zoom buttons, rotation, and navigation
                    transition: true
                });
            })
            .catch(err => console.error("Could not load images.json. Ensure the file exists and is populated.", err));
    </script>
</body>
</html>
